  { pattern = "www.roguedivisions.com/horizons-2026/*", zone_name = "roguedivisions.com" },
  { pattern = "roguedivisions.com/horizons-2026", zone_name = "roguedivisions.com" },
  { pattern = "roguedivisions.com/horizons-2026/*", zone_name = "roguedivisions.com" },
]

[assets]
